name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-ci:
    name: Backend Lint, Test & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"
      - name: Check backend directory
        id: check-backend
        run: |
          if [ -f requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies
        if: steps:check-backend.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio respx pip-audit
      - name: Lint with ruff
        if: steps:check-backend.outputs.exists == 'true'
        run: |
          ruff check .
      - name: Run tests with pytest
        if: steps:check-backend.outputs.exists == 'true'
        run: |
          pytest -v
      - name: Security audit with pip-audit
        if: steps:check-backend.outputs.exists == 'true'
        run: |
          pip-audit --desc on

  frontend-ci:
    name: Frontend Lint, Typecheck, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Check frontend directory
        id: check-frontend
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies
        if: steps:check-frontend.outputs.exists == 'true'
        run: |
          npm ci
      - name: Lint and Typecheck
        if: steps:check-frontend.outputs.exists == 'true'
        run: |
          npm run lint --if-present
          npx tsc --noEmit
      - name: Build
        if: steps:check-frontend.outputs.exists == 'true'
        run: |
          npm run build
      - name: Security audit with npm audit
        if: steps:check-frontend.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high
