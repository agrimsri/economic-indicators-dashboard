name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-ci:
    name: Backend Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend directory
        id: check-backend
        run: |
          if [ -d backend ] && [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.check-backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.check-backend.outputs.exists == 'true'
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio respx pip-audit
      - name: Lint with ruff
        if: steps.check-backend.outputs.exists == 'true'
        run: |
          cd backend
          ruff check .
      - name: Run tests with pytest
        if: steps.check-backend.outputs.exists == 'true'
        run: |
          cd backend
          pytest -v
      - name: Security audit with pip-audit
        if: steps.check-backend.outputs.exists == 'true'
        run: |
          cd backend
          pip-audit --desc on

  frontend-ci:
    name: Frontend Lint, Typecheck, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend directory
        id: check-frontend
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci
      - name: Lint and Typecheck
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm run lint --if-present
          npx tsc --noEmit
      - name: Build
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm run build
      - name: Security audit with npm audit
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm audit --audit-level=high
