services:
  # Backend FastAPI Web Service
  - type: web
    name: economic-indicators-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_history.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: economic-indicators-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: economic-indicators-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: economic-indicators-api
          property: host

databases:
  # Private Managed Postgres Database (Unreachable from public internet)
  - name: economic-indicators-db
    region: oregon
    plan: free
    databaseName: economic_dashboard
    user: app_user
    ipAllowList: [] # Deny all public internet traffic; reachable only by internal backend service
